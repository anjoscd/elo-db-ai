[package]
name = "elo-ctx"
version = "0.2.0"
edition = "2021"
license-file = "LICENSE"
description = "Local context and memory engine for coding agents"
publish = false

[lib]
name = "elo_ctx"
path = "src/lib.rs"

[[bin]]
name = "elo"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5.20", features = ["derive"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.19"
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10.8"
tar = "0.4"
flate2 = "1.0"
thiserror = "1.0.64"
tree-sitter = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
unicode-normalization = "0.1"
tempfile = "3.13.0"

[dev-dependencies]
